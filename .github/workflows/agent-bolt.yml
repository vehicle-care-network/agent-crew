name: Agent · Bolt

# Bolt, the implementer. Started by Agent HQ for one mission: either sketch an HTML mock for approval, or
# build the approved one on a fresh `agent/<mission>` branch. HQ opens the PR; only a person lands it.
# Reusable: a repo's `.github/workflows/agent-bolt.yml` is a thin caller of this one. Brief: briefs/BOLT.md.

on:
  workflow_call:
    # Named, not inherited: GitHub honours `secrets: inherit` only when the caller is in the crew's own org.
    # Callers elsewhere (kayvannj/*) pass these two by name; same-org callers may still inherit.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude subscription token; preferred'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Claude API key; the fallback when the token is not set'
        required: false
    inputs:
      params:
        description: 'JSON from Agent HQ: { mission_id, mode: mock|build, task, feedback, mock_url }'
        required: true
        type: string

jobs:
  bolt:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: agent-bolt-${{ fromJSON(inputs.params).mission_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      MISSION_ID: ${{ fromJSON(inputs.params).mission_id }}
      BOLT_MODE: ${{ fromJSON(inputs.params).mode }}
      AGENT_HQ_URL: ${{ vars.AGENT_HQ_URL || 'https://agent-hq-cyan.vercel.app' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the crew
        id: crew
        uses: vehicle-care-network/agent-crew@v1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.crew.outputs.node }}
          cache: npm

      - name: Install dependencies
        if: env.BOLT_MODE == 'build'
        run: bash -c "$(jq -r .commands.install .github/agents/crew.json)"

      - name: Start the mission branch
        if: env.BOLT_MODE == 'build'
        run: git checkout -b "agent/$MISSION_ID"

      # An empty status is a heartbeat: it keeps HQ from flagging a long build as stalled.
      - name: Check in with HQ
        run: |
          mkdir -p agent-out
          node .crew/scripts/agents/hq.mjs status "$MISSION_ID" bolt ""
          ( while sleep 600; do node .crew/scripts/agents/hq.mjs status "$MISSION_ID" bolt "" || true; done ) &

      - name: Pick the model (set in Agent HQ)
        id: model
        continue-on-error: true
        run: echo "model=$(node .crew/scripts/agents/hq.mjs model bolt)" >> "$GITHUB_OUTPUT"

      - name: Bolt works
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          BOLT_TASK: ${{ fromJSON(inputs.params).task }}
          BOLT_FEEDBACK: ${{ fromJSON(inputs.params).feedback }}
          BOLT_MOCK_URL: ${{ fromJSON(inputs.params).mock_url }}
          GH_TOKEN: ${{ github.token }}
        with:
          # The Claude subscription when its token is set; the API key only as the fallback (given both,
          # the action uses the API key).
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Agent HQ starts these runs as its GitHub App; the action refuses bot-started runs unless listed.
          allowed_bots: vcn-agent-hq,vcn-agent-hq[bot]
          prompt: |
            Follow the brief in .crew/briefs/BOLT.md.
            MISSION_ID: ${{ env.MISSION_ID }}
            BOLT_MODE: ${{ env.BOLT_MODE }}
            The task, feedback and mock link are in the environment variables BOLT_TASK, BOLT_FEEDBACK and BOLT_MOCK_URL.
          claude_args: |
            --model ${{ steps.model.outputs.model || vars.AGENT_MODEL_BOLT || 'claude-opus-5-5' }}
            --max-turns 200
            --allowedTools Bash,Read,Write,Edit,Glob,Grep

      # Cost and tokens for Agent HQ's Spend view. Never fails the job.
      - name: Report usage to HQ
        continue-on-error: true
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          HAS_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: node .crew/scripts/agents/usage.mjs "${{ steps.claude.outputs.execution_file }}" bolt "$BOLT_MODE" "$MISSION_ID" ""

      - name: Send the mock to HQ
        if: env.BOLT_MODE == 'mock'
        run: |
          test -s agent-out/mock.html || { echo "::error::Bolt didn't write agent-out/mock.html"; exit 1; }
          pathname=$(node .crew/scripts/agents/hq.mjs upload "$MISSION_ID" agent-out/mock.html)
          notes=$(cat agent-out/notes.md 2>/dev/null || true)
          node .crew/scripts/agents/hq.mjs report "$MISSION_ID" "$(jq -n --arg p "$pathname" --arg n "$notes" '{agent:"bolt",type:"mock",pathname:$p,notes:$n}')"

      # A push made with the job's own token runs no workflows: no linter, no Iris re-review, no Radar
      # label on the crew's commits. HQ hands Bolt a one-hour token to push as the HQ App instead
      # (contents: write on this repo only). Without one (HQ unreachable, or the App not granted Contents:
      # write) the push still happens with the job's token.
      - name: Get a push token from HQ
        id: push
        if: env.BOLT_MODE == 'build'
        run: |
          if token=$(node .crew/scripts/agents/hq.mjs github-token 2>hq-token.err); then
            echo "::add-mask::$token"
            echo "Pushing as the HQ App."
          else
            echo "::warning::Pushing with the job's token, so no workflows will run on this push: $(tail -n 1 hq-token.err)"
            token=""
          fi
          rm -f hq-token.err
          echo "token=${token:-${{ github.token }}}" >> "$GITHUB_OUTPUT"

      - name: Push the branch and tell HQ
        if: env.BOLT_MODE == 'build'
        env:
          PUSH_TOKEN: ${{ steps.push.outputs.token }}
        run: |
          if [ -s agent-out/blocked.md ]; then echo "::error::Bolt is blocked: $(head -c 400 agent-out/blocked.md)"; exit 1; fi
          test -s agent-out/pr.json || { echo "::error::Bolt didn't write agent-out/pr.json"; exit 1; }
          git add -A
          git diff --cached --quiet && { echo "::error::Bolt made no changes"; exit 1; }
          title=$(jq -r .title agent-out/pr.json)
          git -c user.name="Bolt (Agent HQ)" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$title" -m "Agent HQ mission $MISSION_ID"
          git push -q "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/agent/$MISSION_ID"
          node .crew/scripts/agents/hq.mjs report "$MISSION_ID" "$(jq -n --arg b "agent/$MISSION_ID" --arg t "$title" --arg s "$(jq -r .summary agent-out/pr.json)" '{agent:"bolt",type:"built",branch:$b,title:$t,summary:$s}')"

      - name: Tell HQ it failed
        if: failure()
        run: |
          reason=$(cat agent-out/blocked.md 2>/dev/null | head -c 400)
          node .crew/scripts/agents/hq.mjs report "$MISSION_ID" "$(jq -n --arg e "${reason:-The Bolt run failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}}" '{agent:"bolt",type:"failed",error:$e}')"
