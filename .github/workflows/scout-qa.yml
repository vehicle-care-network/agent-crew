name: Scout QA

# Scout tests a PR the way a user would and posts screenshots, videos and results on the PR. Mode
# `regression` tests the latest main across every core flow instead of one PR; results go to Agent HQ,
# failures to its Ideas inbox. Given a `sha` and a `mission_id` (a release branch Rocket built), the same
# run reports to that release mission instead of the repo's health. Mode `smoke` runs one scenario HQ gives it (a saved smoke test, on a
# schedule or after a production deploy) on main or on the commit HQ names; the result goes to the HQ
# mission that started it. Mode `coverage` is a regression run on main that also writes a committed spec
# for every core flow without one; HQ opens a PR with what it wrote. Reusable: a repo's
# `.github/workflows/scout-qa.yml` holds the triggers (the `scout` label, `/scout` comments, manual runs,
# Agent HQ) and calls this. Brief: scout/PROMPT.md.
#
# The repo provides: .github/agents/crew.json (scout settings), .github/scout/core-flows.md, the flow
# guidance per area in .github/scout/flows/*.md, scripts/scout/seed.mjs and fixtures.mjs,
# e2e/scout/_support/scout.ts (the Playwright harness and logins), e2e/scout/core/*.spec.ts and the
# flows kept from PR runs in e2e/scout/features/<area>/.
#
# Three tiers of testing, one workflow: a PR gets the core flows, the kept flows of the areas it touches
# and Scout's own flows for the change; a release branch (regression with a mission) gets the committed
# flows only, no agent, so the gate is the same every time; main's health is the regression run.
# Production itself is probed by scout-probe.yml, which never involves Scout.

on:
  workflow_call:
    # Named, not inherited: GitHub honours `secrets: inherit` only when the caller is in the crew's own org.
    # Callers elsewhere (kayvannj/*) pass these two by name; same-org callers may still inherit.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude subscription token; preferred'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Claude API key; the fallback when the token is not set'
        required: false
    inputs:
      params:
        description: 'JSON from Agent HQ: { mode: pr|regression|smoke|coverage, pr_number, focus, plan, mission_id, scenario_id, sha, only, adjust }. Wins over the inputs below. regression with sha + mission_id: a release branch, reporting to that mission (committed flows only, no agent). plan: the mission test plan, what to make sure of. only: flow titles (one per line) to re-run instead of the whole suite; HQ folds the results into the previous run. adjust (with only): how to change that flow before running it again.'
        required: false
        type: string
        default: ''
      mode:
        description: pr or regression (manual input; default pr)
        required: false
        type: string
        default: ''
      pr_number:
        description: PR to test (from the caller's event or manual input)
        required: false
        type: string
        default: ''
      focus:
        description: What Scout should cover first (manual input)
        required: false
        type: string
        default: ''
      comment:
        description: The `/scout ...` comment body, when a comment started the run
        required: false
        type: string
        default: ''

jobs:
  scout:
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04 (Nov 2026), which Playwright has no Chromium build for
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # to reuse the specs Scout wrote on this PR's previous run
    env:
      SCOUT_OUT: scout-out
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AGENT_HQ_URL: ${{ vars.AGENT_HQ_URL || 'https://agent-hq-cyan.vercel.app' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # One request, whoever sent it: HQ's JSON wins, then the caller's event or manual inputs.
      - name: Read the request
        id: pr
        env:
          PARAMS: ${{ inputs.params || '{}' }}
          IN_MODE: ${{ inputs.mode }}
          IN_PR: ${{ inputs.pr_number }}
          IN_FOCUS: ${{ inputs.focus }}
          COMMENT: ${{ inputs.comment }}
        run: |
          mode=$(jq -r '.mode // empty' <<<"$PARAMS"); mode="${mode:-${IN_MODE:-pr}}"
          case "$mode" in regression|smoke|coverage) ;; *) mode=pr ;; esac
          echo "SCOUT_MODE=$mode" >> "$GITHUB_ENV"
          # Smoke tests report to the HQ mission that started them (no PR comment).
          echo "MISSION_ID=$(jq -r '.mission_id // empty' <<<"$PARAMS")" >> "$GITHUB_ENV"
          echo "SCENARIO_ID=$(jq -r '.scenario_id // empty' <<<"$PARAMS" | tr -cd 'A-Za-z0-9_-')" >> "$GITHUB_ENV"
          # Focus: HQ's, the manual input, or the text after `/scout` on the comment's first line.
          focus=$(jq -r '.focus // empty' <<<"$PARAMS")
          [ -n "$focus" ] || focus="${IN_FOCUS:-$(printf '%s' "$COMMENT" | head -1 | sed -E 's#^/scout[[:space:]]*##')}"
          # Only: flow titles HQ wants run again (one per line), e.g. one that timed out. Scout re-runs
          # just those; HQ keeps the rest of the verdict from the previous run. Adjust: how to change
          # that flow first (a note from the evidence viewer's "Adjust this flow").
          only=$(jq -r '.only // empty' <<<"$PARAMS" | head -10)
          { echo "SCOUT_ONLY<<SCOUT_EOF"; printf '%s\n' "$only"; echo "SCOUT_EOF"; } >> "$GITHUB_ENV"
          adjust=$(jq -r '.adjust // empty' <<<"$PARAMS" | head -c 2000)
          { echo "SCOUT_ADJUST<<SCOUT_EOF"; printf '%s\n' "$adjust"; echo "SCOUT_EOF"; } >> "$GITHUB_ENV"
          # Plan: the mission's test plan, written in HQ: what to make sure of, on every run of this mission.
          plan=$(jq -r '.plan // empty' <<<"$PARAMS" | head -c 2000)
          { echo "SCOUT_PLAN<<SCOUT_EOF"; printf '%s\n' "$plan"; echo "SCOUT_EOF"; } >> "$GITHUB_ENV"
          if [ "$mode" = smoke ]; then
            # The commit HQ names (a production deploy's), else the default branch's head.
            number=0; sha=$(jq -r '.sha // empty' <<<"$PARAMS" | tr -cd 'a-f0-9')
            if [ -z "$sha" ]; then
              branch=$(gh api "repos/${{ github.repository }}" --jq .default_branch)
              sha=$(gh api "repos/${{ github.repository }}/commits/$branch" --jq .sha)
            fi
            [ -n "$focus" ] || { echo "::error::A smoke test needs the scenario in focus"; exit 1; }
          elif [ "$mode" = regression ] || [ "$mode" = coverage ]; then
            # The commit HQ names (a release branch's head, reporting to the release mission), else the
            # default branch's head (the repo's health; coverage always).
            number=0; sha=$(jq -r '.sha // empty' <<<"$PARAMS" | tr -cd 'a-f0-9')
            if [ -z "$sha" ]; then
              branch=$(gh api "repos/${{ github.repository }}" --jq .default_branch)
              sha=$(gh api "repos/${{ github.repository }}/commits/$branch" --jq .sha)
            fi
          else
            number=$(jq -r '.pr_number // empty' <<<"$PARAMS"); number="${number:-$IN_PR}"
            [ -n "$number" ] || { echo "::error::No PR number in the request"; exit 1; }
            gh api "repos/${{ github.repository }}/pulls/$number" > pr.json
            if [ "$(jq -r .head.repo.full_name pr.json)" != "${{ github.repository }}" ]; then
              echo "::error::Scout only runs on branches in this repository, not forks (no secrets are exposed to fork code)."
              exit 1
            fi
            sha=$(jq -r .head.sha pr.json)
          fi
          { echo "number=$number"; echo "sha=$sha"; echo "focus<<SCOUT_EOF"; printf '%s\n' "$focus"; echo "SCOUT_EOF"; } >> "$GITHUB_OUTPUT"
          echo "Mode $mode, PR #$number at ${sha:0:7}, focus: ${focus:-(none)}${only:+, only: $(printf '%s' "$only" | tr '\n' ';')}"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      # Branches opened before Scout's data existed don't contain it, so take the repo's Scout pieces
      # (crew.json, risk map, core flows, seed, core specs) from the commit this run was started from (main
      # for comments, HQ and manual runs) and lay them over the PR's code. The harness is the exception: it
      # must match the UI under test, so the PR's copy wins when it has one (see the install step).
      - name: Fetch the repo's Scout pieces
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .scout-tooling
          sparse-checkout: |
            .github/agents
            .github/scout
            scripts/scout
            e2e/scout/_support
            e2e/scout/core
            e2e/scout/features
          sparse-checkout-cone-mode: false

      - name: Install them over the PR
        run: |
          mkdir -p .github/agents .github/scout scripts/scout e2e/scout
          cp -R .scout-tooling/.github/agents/. .github/agents/
          cp -R .scout-tooling/.github/scout/. .github/scout/
          cp -R .scout-tooling/scripts/scout/. scripts/scout/
          cp -R .scout-tooling/e2e/scout/core e2e/scout/
          # Kept feature flows: main's fill in what the PR doesn't have; the PR's own copies win, since a PR
          # that changes a feature updates its kept flow in the same PR (Iris reviews that like any code).
          if [ -d .scout-tooling/e2e/scout/features ]; then
            mkdir -p e2e/scout/features
            cp -Rn .scout-tooling/e2e/scout/features/. e2e/scout/features/
          fi
          # The harness (sign-in helper, evidence) has to match the UI under test, so the PR's copy wins when
          # the PR has one: a PR that changes the header fixes the sign-in helper in the same PR, and a Patch
          # fix to it takes effect (main's copy laid over the PR made every core flow fail at sign-in after a
          # header change, run after run, with nothing Patch could do). The core specs still come from main,
          # so a PR can't weaken what they check; Iris reviews the harness like any other code.
          if [ -f e2e/scout/_support/scout.ts ]; then
            echo "[Scout] Using this PR's harness (e2e/scout/_support)"
          else
            cp -R .scout-tooling/e2e/scout/_support e2e/scout/
          fi
          rm -rf .scout-tooling

      - name: Set up the crew
        id: crew
        uses: vehicle-care-network/agent-crew@v1

      # How much testing this PR deserves, from Radar's risk map: low-impact changes (docs, tests, tooling)
      # get the smoke flows only and no agent; the rest get a flow budget and a turn cap by impact.
      # Also which areas of the product the change touches (.github/scout/flows/*.md): their guidance goes
      # to Scout, their kept flows run, and the kept flows of every other area are left out (SCOUT_IGNORE).
      - name: Size the run
        id: scope
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          FOCUS: ${{ steps.pr.outputs.focus }}
        run: |
          mkdir -p scout-out
          if [ "$SCOUT_MODE" = pr ]; then
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename' > changed-files.txt
            node .crew/scripts/scout/areas.mjs < changed-files.txt > scout-out/areas.json
          else
            node .crew/scripts/scout/areas.mjs --all > scout-out/areas.json
          fi
          echo "SCOUT_AREAS=$(jq -r '[.areas[].slug] | join(",")' scout-out/areas.json)" >> "$GITHUB_ENV"
          echo "SCOUT_IGNORE=$(jq -r '.ignore | join(",")' scout-out/areas.json)" >> "$GITHUB_ENV"
          # The guidance of those areas, as one file the brief points Scout at.
          jq -r '.areas[] | "## \(.title) (\(.file))\n\n\(.guidance)\n"' scout-out/areas.json > scout-out/guidance.md
          [ -s scout-out/guidance.md ] || rm -f scout-out/guidance.md
          echo "Areas: $(jq -r '[.areas[].slug] | join(", ")' scout-out/areas.json)${SCOUT_PLAN:+; the mission has a test plan}"
          if [ -n "$SCOUT_ONLY" ]; then
            # A re-run of named flows: those specs and nothing else, whatever the mode. The grep that
            # selects them goes to the agent and to the run for the record. With ADJUSTMENTS, Scout
            # rewrites the flow first, so it gets a few more turns.
            case "$SCOUT_MODE" in regression|coverage) tier=regression ;; smoke) tier=smoke ;; *) tier=$(node .crew/scripts/agents/impact.mjs - < changed-files.txt | jq -r .tier) ;; esac
            agent=true; turns=40; budget="only the flows named under FLOWS TO RE-RUN"
            [ -z "$SCOUT_ADJUST" ] || { turns=60; budget="only the flows named under FLOWS TO RE-RUN, changed as ADJUSTMENTS asks"; }
            echo "SCOUT_ONLY_GREP=$(node -e 'import("./.crew/scripts/scout/steps.mjs").then(m=>process.stdout.write(m.onlyGrep(m.parseOnly(process.env.SCOUT_ONLY))))')" >> "$GITHUB_ENV"
          elif [ "$SCOUT_MODE" = regression ] && [ -n "$MISSION_ID" ]; then
            # A release branch: the committed core and kept flows, run as they are. No agent, so the
            # gate is the same for every release and can only change by a merge someone reviewed.
            tier=regression; agent=false; turns=0; budget="none: the committed flows only"
          elif [ "$SCOUT_MODE" = regression ]; then
            tier=regression; agent=true; turns=150; budget="every flow in .github/scout/core-flows.md"
          elif [ "$SCOUT_MODE" = coverage ]; then
            tier=regression; agent=true; turns=150; budget="a committed spec for every core flow that has none, written under e2e/scout/core/"
          elif [ "$SCOUT_MODE" = smoke ]; then
            tier=smoke; agent=true; turns=60; budget="the smoke-test scenario in SCOUT_FOCUS, and nothing else"
          else
            tier=$(node .crew/scripts/agents/impact.mjs - < changed-files.txt | jq -r .tier)
            agent=true
            case "$tier" in
              low)      turns=30; budget="none: smoke flows only"; [ -z "$FOCUS" ] && [ -z "$SCOUT_PLAN" ] && agent=false ;;
              normal)   turns=45; budget="1 to 2 flows" ;;
              high)     turns=70; budget="2 to 3 flows" ;;
              critical) turns=100; budget="up to 5 flows, including edge cases" ;;
            esac
          fi
          rm -f changed-files.txt
          echo "Impact $tier: agent=$agent, budget $budget, max $turns turns"
          { echo "tier=$tier"; echo "agent=$agent"; echo "turns=$turns"; echo "budget=$budget"; } >> "$GITHUB_OUTPUT"

      - name: Post "Scout is testing"
        if: env.SCOUT_MODE == 'pr'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: node .crew/scripts/scout/report.mjs --status running

      # HQ learns the result from the run itself (this, then the evidence manifest), not from the comment.
      # A regression run HQ started for a release mission reports to it like a smoke test does.
      - name: Tell HQ Scout started
        if: env.SCOUT_MODE == 'pr' || env.SCOUT_MODE == 'smoke' || (env.SCOUT_MODE == 'regression' && env.MISSION_ID != '')
        # (A coverage run, like a regression run on main, reports only at the end, through the evidence.)
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: node .crew/scripts/agents/hq.mjs qa running

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.crew.outputs.node }}

      # Installing dependencies took ~2.5 minutes a run; restoring node_modules takes seconds.
      - name: Restore node_modules
        id: deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: scout-deps-${{ runner.os }}-node${{ steps.crew.outputs.node }}-${{ hashFiles('package-lock.json') }}

      - name: Restore the Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: scout-firebase-emulators-v15

      # firebase-tools 15 needs Java 21+ for the Firestore emulator.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash -c "$(jq -r .commands.install .github/agents/crew.json)"

      # Vercel won't deploy a PR that doesn't type-check, so there's nothing worth testing in a browser yet.
      # Type errors in the files this PR changed go to the top of the report (HQ sends Patch to fix them),
      # and the agent is skipped, which saves its tokens.
      - name: Check the build
        id: build
        if: env.SCOUT_MODE == 'pr'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          mkdir -p scout-out
          gh pr diff "$PR_NUMBER" -R "${{ github.repository }}" --name-only | grep -E '\.tsx?$' > changed.txt || true
          bash -c "$(jq -r .commands.typecheck .github/agents/crew.json)" > tsc.txt 2>&1 || true
          grep -F -f changed.txt tsc.txt | grep -E '^[^ ].*\([0-9]+,[0-9]+\): error TS' > build-errors.txt || true
          if [ -s build-errors.txt ]; then
            echo "::error::$(wc -l < build-errors.txt) type errors in files this PR changed"
            cp build-errors.txt scout-out/build-errors.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f changed.txt tsc.txt build-errors.txt

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Re-runs (after Patch pushes a fix, or a new commit) start from the specs Scout already wrote for this
      # PR, instead of exploring and writing them from scratch. Not on a release branch (committed flows
      # only) and not for coverage (it writes committed specs from a clean checkout).
      - name: Reuse specs from the previous run
        id: reuse
        if: env.SCOUT_MODE != 'coverage' && !(env.SCOUT_MODE == 'regression' && env.MISSION_ID != '')
        env:
          NAME: scout-specs-${{ env.SCOUT_MODE == 'regression' && 'regression' || env.SCOUT_MODE == 'smoke' && format('smoke-{0}', env.SCENARIO_ID || env.MISSION_ID) || format('pr-{0}', steps.pr.outputs.number) }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=1" --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > specs.zip
            unzip -o -q specs.zip -d e2e/scout && rm specs.zip
            echo "Reusing specs: $(ls e2e/scout | tr '\n' ' ')"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the app on emulators
        run: bash .crew/scripts/scout/start-env.sh

      # The committed flows' own data: seed scripts kept beside the core and feature specs.
      - name: Load the kept flows' seeds
        run: |
          set -a; . ./.env.local; set +a
          for f in e2e/scout/core/_seed/*.mjs e2e/scout/features/_seed/*.mjs; do [ -f "$f" ] && { echo "[Scout] Seeding $f"; node "$f"; }; done
          true

      # Specs reused from the previous run need the data their seed scripts create.
      - name: Load seeds from the previous run
        if: steps.reuse.outputs.reused == 'true'
        run: |
          set -a; . ./.env.local; set +a
          for f in e2e/scout/_seed/*.mjs; do [ -f "$f" ] && node "$f"; done

      - name: Pick the model (set in Agent HQ)
        id: model
        if: steps.scope.outputs.agent == 'true' && steps.build.outputs.ok != 'false'
        continue-on-error: true
        run: echo "model=$(node .crew/scripts/agents/hq.mjs model scout)" >> "$GITHUB_OUTPUT"

      - name: Scout explores, seeds and writes specs
        id: scout
        if: steps.scope.outputs.agent == 'true' && steps.build.outputs.ok != 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SCOUT_BASE_URL: ${{ steps.crew.outputs.scout_base_url }}
          SCOUT_FOCUS: ${{ steps.pr.outputs.focus }}
          SCOUT_TIER: ${{ steps.scope.outputs.tier }}
          SCOUT_BUDGET: ${{ steps.scope.outputs.budget }}
          SCOUT_REUSED: ${{ steps.reuse.outputs.reused }}
        with:
          # The Claude subscription when its token is set; the API key only as the fallback (given both,
          # the action uses the API key).
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Agent HQ starts these runs as its GitHub App; the action refuses bot-started runs unless listed.
          allowed_bots: vcn-agent-hq,vcn-agent-hq[bot]
          prompt: |
            Follow the brief in .crew/scout/PROMPT.md.
            SCOUT_MODE: ${{ env.SCOUT_MODE }}
            PR_NUMBER: ${{ steps.pr.outputs.number }}
            SCOUT_BASE_URL: ${{ steps.crew.outputs.scout_base_url }}
            SCOUT_FOCUS: ${{ steps.pr.outputs.focus || '(none)' }}
            TEST PLAN: ${{ env.SCOUT_PLAN || '(none)' }}
            AREAS: ${{ env.SCOUT_AREAS || '(none matched)' }}
            GUIDANCE FILE: ${{ env.SCOUT_AREAS && 'scout-out/guidance.md' || '(none)' }}
            IMPACT: ${{ steps.scope.outputs.tier }}
            FLOW BUDGET: ${{ steps.scope.outputs.budget }}
            SPECS FROM THE PREVIOUS RUN: ${{ steps.reuse.outputs.reused == 'true' && 'yes, under e2e/scout' || 'none' }}
            FLOWS TO RE-RUN: ${{ env.SCOUT_ONLY || '(none: a full run)' }}
            PLAYWRIGHT GREP FOR THEM: ${{ env.SCOUT_ONLY_GREP || '(none)' }}
            ADJUSTMENTS: ${{ env.SCOUT_ADJUST || '(none)' }}
          claude_args: |
            --model ${{ steps.model.outputs.model || vars.AGENT_MODEL_SCOUT || 'claude-sonnet-5-5' }}
            --max-turns ${{ steps.scope.outputs.turns }}
            --mcp-config .crew/scout/mcp.json
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,mcp__playwright

      # Cost and tokens for Agent HQ's Spend view. Never fails the job.
      - name: Report usage to HQ
        continue-on-error: true
        if: always() && steps.scout.outputs.execution_file != ''
        env:
          HAS_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: node .crew/scripts/agents/usage.mjs "${{ steps.scout.outputs.execution_file }}" scout "${{ env.SCOUT_MODE == 'regression' && 'regression' || env.SCOUT_MODE == 'coverage' && 'coverage' || env.SCOUT_MODE == 'smoke' && 'smoke' || 'qa' }}" "${{ env.MISSION_ID }}" "${{ steps.pr.outputs.number }}"

      # The comment's pass/fail comes from this run, not from the agent's own runs: every spec, core and
      # PR-specific, is executed once more against the final state of the tests. A re-run of named flows
      # runs those alone; HQ folds the results into the previous run's.
      - name: Run every Scout spec for the record
        if: always()
        env:
          SCOUT_BASE_URL: ${{ steps.crew.outputs.scout_base_url }}
        run: |
          if [ -n "$SCOUT_ONLY_GREP" ]; then
            echo "Re-running only: $SCOUT_ONLY_GREP"
            npx playwright test -c .crew/playwright.scout.config.ts --grep "$SCOUT_ONLY_GREP" || true
          else
            npx playwright test -c .crew/playwright.scout.config.ts || true
          fi

      - name: Keep the specs for the next run
        if: always() && env.SCOUT_MODE != 'coverage' && !(env.SCOUT_MODE == 'regression' && env.MISSION_ID != '')
        uses: actions/upload-artifact@v7
        with:
          name: scout-specs-${{ env.SCOUT_MODE == 'regression' && 'regression' || env.SCOUT_MODE == 'smoke' && format('smoke-{0}', env.SCENARIO_ID || env.MISSION_ID) || format('pr-{0}', steps.pr.outputs.number) }}
          # Everything Scout wrote for this PR, not just the specs: a helper module a spec imports
          # (`pr-8-login.ts`) left behind makes every reused spec fail to load, and the run ends with no
          # results at all.
          path: |
            e2e/scout/pr-*
            e2e/scout/pr-*/**
            e2e/scout/regression/
            e2e/scout/smoke/
            e2e/scout/_seed/
          if-no-files-found: ignore
          retention-days: 30

      # Screenshots and videos go to Agent HQ, where they play inline. The run authenticates with its
      # GitHub OIDC token (id-token: write above), so no HQ secret is stored in any repo.
      - name: Send evidence to Agent HQ
        id: hq
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          SCOUT_AGENT_OUTCOME: ${{ steps.scout.outcome }}
          SCOUT_TIER: ${{ steps.scope.outputs.tier }}
        run: node .crew/scripts/scout/upload-evidence.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scout-evidence
          path: |
            scout-out/
            e2e/scout/
          retention-days: 14

      - name: Send regression failures to HQ's Ideas
        if: always() && (env.SCOUT_MODE == 'regression' || env.SCOUT_MODE == 'coverage') && env.MISSION_ID == ''
        run: |
          node .crew/scripts/scout/regression-ideas.mjs > scout-out/regression-ideas.json
          node .crew/scripts/agents/hq.mjs ideas-post scout-out/regression-ideas.json regression

      - name: Post the report
        if: always() && env.SCOUT_MODE == 'pr'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          SCOUT_AGENT_OUTCOME: ${{ steps.scout.outcome }}
          SCOUT_TIER: ${{ steps.scope.outputs.tier }}
          HQ_EVIDENCE_URL: ${{ steps.hq.outputs.url }}
        run: node .crew/scripts/scout/report.mjs

      - name: Stop the app
        if: always()
        run: bash .crew/scripts/scout/stop-env.sh

      # The agent step is continue-on-error so the report still posts; fail the run afterwards so a broken
      # agent (missing key, crash) shows red in the checks instead of a misleading green.
      - name: Fail if the agent didn't run
        if: steps.scout.outcome == 'failure'
        run: |
          echo "::error::Scout's agent step failed, so this PR was only smoke-tested. Check that ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN is set."
          exit 1

      # HQ learns the verdict from the evidence manifest. If that didn't get through, the PR comment is
      # posted but the mission stays "Scout is testing": say so loudly instead of a green run.
      - name: Fail if the result didn't reach HQ
        if: steps.hq.outcome == 'failure' && (env.SCOUT_MODE == 'pr' || env.SCOUT_MODE == 'smoke' || (env.SCOUT_MODE == 'regression' && env.MISSION_ID != ''))
        run: |
          echo "::error::Scout's result never reached Agent HQ (the evidence step failed), so the mission still shows Scout testing. See the 'Send evidence to Agent HQ' step; when HQ is back, send Scout again from the mission."
          exit 1
